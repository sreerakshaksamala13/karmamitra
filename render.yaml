# Render Blueprint for Karmamitra — the whole free-tier stack in one file:
#
#   1. karmamitra-api   Node/Express API   (Web Service, free plan)
#   2. karmamitra-web   Vite React SPA     (Static Site, free plan)
#
# MongoDB Atlas (M0) is provisioned separately — see DEPLOY.md.
# Deploy: Render Dashboard → New → Blueprint → pick this repo.

services:
  # ---------- API (Express + MongoDB Atlas) ----------
  - type: web
    runtime: node
    name: karmamitra-api
    region: oregon
    plan: free
    rootDir: server
    # No build step needed; Render installs dependencies from package-lock.json.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render prompts for these two secrets when the Blueprint is created.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Exact browser origin allowed by CORS (must match the static site URL).
      - key: CLIENT_ORIGINS
        value: https://karmamitra-web.onrender.com

  # ---------- Web app (Vite React SPA) ----------
  - type: web
    runtime: static
    name: karmamitra-web
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA fallback: any path that isn't a real file serves index.html so
    # client-side routes like /login and /dispatches survive a hard refresh.
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html
    envVars:
      # Baked into the bundle at build time — the API is on a different origin.
      - key: VITE_API_URL
        value: https://karmamitra-api.onrender.com/api
