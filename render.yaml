# Render Blueprint for Karmamitra — the whole free-tier stack in one file:
#
#   1. karmamitra-api   Node/Express API   (Web Service, free plan)
#   2. karmamitra-web   Vite React SPA     (Static Site, free plan)
#
# MongoDB Atlas (M0) is provisioned separately — see DEPLOY.md.
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# Exported from Render on 2026-10-11T15:21:07Z
version: "1"
services:
- type: web
  name: karmamitra-api
  runtime: node
  repo: https://github.com/sreerakshaksamala13/karmamitra
  plan: free
  envVars:
  - key: CLIENT_ORIGINS
    sync: false
  - key: JWT_SECRET
    sync: false
  - key: MONGO_URI
    sync: false
  - key: NODE_ENV
    sync: false
  region: oregon
  startCommand: npm start
  healthCheckPath: /api/health
  autoDeployTrigger: commit
  rootDir: server


