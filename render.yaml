# Render Blueprint for Karmamitra — the whole free-tier stack in one file:
#
#   1. karmamitra-api   Node/Express API   (Web Service, free plan)
#   2. karmamitra-web   Vite React SPA     (Static Site, free plan)
#
# MongoDB Atlas (M0) is provisioned separately — see DEPLOY.md.
# Deploy: Render Dashboard → New → Blueprint → pick this repo.

services:
  # ---------- API (Express + MongoDB Atlas) ----------
  - type: web
    runtime: node
    name: karmamitra-api
    region: oregon
    plan: free
    rootDir: server
    # No build step needed; Render installs dependencies from package-lock.json.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render prompts for these two secrets when the Blueprint is created.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Exact browser origin allowed by CORS (must match the Vercel URL).
      - key: CLIENT_ORIGINS
        value: https://karmamita.vercel.app


